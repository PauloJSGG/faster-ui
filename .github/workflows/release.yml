name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight PR runs, but never cancel a release that is mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep in step with the npm used to maintain package-lock.json.
  NPM_VERSION: 11.6.2

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The npm bundled with a Node release changes over time, and npm versions
      # disagree about which optional transitive packages a lockfile must record.
      # Pinning keeps `npm ci` from failing on lockfile-sync differences alone.
      - name: Pin npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Component tests
        uses: cypress-io/github-action@v7
        with:
          component: true
          install: false

      - name: Build and validate package
        run: npm run verify:package

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the git tag and GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # OIDC trusted publishing to npm, with provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history to find the last tag

      # registry-url is deliberately unset: it writes an .npmrc that shadows the
      # OIDC flow used by trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-save semantic-release @semantic-release/changelog
          npx semantic-release
